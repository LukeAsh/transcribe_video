[project]
name = "transcribe-video"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukas", email = "lukas@zbook" },
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
transcribe-video = "transcribe_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=1.18.0",
    "pytest>=9.0.1",
    "ruff>=0.14.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
