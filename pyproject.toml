[project]
name = "transcribe-video"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lukas", email = "lukas@zbook" },
]
requires-python = "==3.12"
dependencies = [
    "faster-whisper==1.2.1",
    "av==18.1.0",
    "yt-dlp==2026.8.19",
    "yt-dlp-ejs==0.8.0",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cudnn-cu12==9.27.0.42",
]

[project.scripts]
transcribe-video = "transcribe_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
